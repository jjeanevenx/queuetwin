name: Feature proposal
description: Suggest a scoped feature or provider-model improvement.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the failure mode or workflow, not only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Include deterministic sample inputs and observable outcomes where possible.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Provider documentation and relevant alternatives
